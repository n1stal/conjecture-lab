version: "v0.4"
project:
  name: "A two-parameter counterexample family for Turau’s amnesiac flooding conjecture"
  description: >-
    For every source count k at least four and every t at least three, construct
    a finite connected non-bipartite graph of radius kt minus ceil(k/2) and
    exhibit k sources whose literal amnesiac flooding takes exactly t send
    rounds. This disproves the stronger radius inequality in Section 8 of
    Turau's preprint. Turau's Theorem 4(3), used as a cited mathematical
    result and not part of the Lean claim, also gives optimality of the displayed
    sources. This extends the radius and three-round counterexample family
    recorded in version 1.
  authors:
    - "Jaime Nistal"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jaime Nistal"
classification:
  arxiv: ["cs.DC", "math.CO"]
  msc2020: ["05C12", "68W15", "03B35"]
sources:
  - title: "A counterexample and infinite family for Turau’s amnesiac flooding conjecture"
    type: "formalization"
    id: "PALOMAR-2026-11-26-000065"
    location: "https://palomar-registry.org/entry?id=PALOMAR-2026-11-26-000065&version=1"
    relationship: "adapts"
    note: "Extends the existing family from the fixed three-round case to every prescribed t at least three."
  - title: "Analysis of Amnesiac Flooding"
    authors: ["Volker Turau"]
    id: "https://arxiv.org/abs/2002.10752v4"
    location: "Section 4, Theorem 4(3), and Section 8"
    type: "article"
    relationship: "background"
    note: "Algorithm and conjecture source. Theorem 4(3) is cited only for optimality."
related_formalizations:
  - id: "PALOMAR-2026-11-26-000065"
    relationship: "builds-on"
    note: "Version 1 gives the special case t=3; a possible version extension."
status:
  scope: >-
    Literal send-round recursion, graph simplicity and non-bipartiteness,
    connectivity, bijective indexing of displayed sources by blocks,
    receipt of the message at every vertex, exact displayed source execution
    time and exact radius. The unrestricted optimization problem and the proof
    of Turau's Theorem 4(3) are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
