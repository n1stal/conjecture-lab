version: "v0.4"
project:
  name: "Exact weighted terminal distances for up to five packed vertices or four terminals"
  description: >-
    For arbitrary finite terminal count and nonnegative integer terminal weights,
    in finite simple connected graphs with positive exact distance-k packing number p,
    with p at most five or exactly four prescribed terminals, the maximum
    product-weighted sum of shortest
    distances on unordered terminal pairs is k times the total pair weight
    plus (k+1)(p−1) times the maximum terminal cut product. Here k is any
    positive integer, and distinct packing vertices have distance strictly
    greater than k. The result proves the upper bound and exact attainment.
  authors: ["Jaime Nistal"]
  responsible_maintainers: ["Jaime Nistal"]
  license: "Apache-2.0"
