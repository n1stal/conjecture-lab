version: "v0.4"
project:
  name: "Parallel-pair, support-star, and double-star obstructions in Erdős Problem 617"
  description: >-
    In the actual balanced r-coloring and normalized two-support core specified
    in the Challenge, the previously formalized high-deficit pair bound gives
    at most d+e-2 shared exceptions for r at least twelve, d,e at least three,
    and d+e at most r-3. The new refined-star theorem excludes an overloaded
    support star under the stated spoke gap, row-size, and palette conditions.
    In particular, for hub deficit D at least three and r at least (D+1)^2,
    a normalized support star is impossible if every leaf has deficit e
    between three and D and exactly e+1 exceptions on its spoke. This is a
    conditional structural exclusion, not a resolution of Erdős Problem 617.
    The added uniform double-star theorem excludes a normalized two-hub support
    when all row deficits are between three and D and r is at least
    ceil(49 D^2/64)+6D+10. Its normalization explicitly includes exact spoke
    geometry, strict leaf surpluses, disjoint exceptions and one total overload.
  authors: ["Jaime Nistal"]
  responsible_maintainers: ["Jaime Nistal"]
  license: "Apache-2.0"
