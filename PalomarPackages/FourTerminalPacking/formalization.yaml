version: "v0.4"
project:
  name: "Sharp distance packing for four prescribed terminals"
  description: >-
    For positive integers k and p, among finite simple connected graphs with
    distance-k packing number p, the maximum sum of the six pairwise shortest
    distances on four distinct vertices is 6k + 4(k+1)(p−1). A distance-k packing
    requires all its pairwise distances to exceed k. More generally, for
    nonnegative integer terminal weights the maximum product-weighted sum is
    k times the total weight of the six pairs plus (k+1)(p−1) times the maximum
    weighted cut on the four terminals. Both endpoints prove the universal bound
    and construct an attaining connected graph with exact packing number p.
  authors: ["Jaime Nistal"]
  responsible_maintainers: ["Jaime Nistal"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.CO"]
  msc2020: ["05C12", "05C69"]
