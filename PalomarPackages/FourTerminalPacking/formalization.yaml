    author_endorsement: "not-contacted"
  - title: "The average distance and the independence number"
    authors: ["F. R. K. Chung"]
    type: "paper"
    id: "https://doi.org/10.1002/jgt.3190120213"
    relationship: "background"
    location: "Journal of Graph Theory 12 (1988), 229–235"
    note: >-
      Chung's average-distance theorem implies the unweighted k=1 upper
      bound for an even number of terminals by true-clique cloning; this
      includes the four-terminal unweighted special case.
status:
  scope: >-
    Exact four-terminal packing extremum for all positive k and p, with
    unweighted and nonnegative integer-weighted objectives. Does not claim
    the finite extremum for five or more terminals or the disjoint-separator
    branch of Question 3. Real weights are not a compared Lean target.
