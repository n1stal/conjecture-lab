    authors: ["Jaime Nistal"]
    type: "original-proof"
    relationship: "other"
    location: "PROOF.md and Palomar.WalkMapleQuartic.Solution"
    note: >-
      This presentation gives the proof via exact reachable-deficit states,
      first-return and first-exit decompositions, and the canonical formal
      power-series solution. We make no broader priority claim.
  - title: "Combinatorics of nondeterministic walks"
    authors: ["Élie de Panafieu", "Michael Wallner"]
    type: "paper"
    id: "https://arxiv.org/abs/2311.03234v2"
