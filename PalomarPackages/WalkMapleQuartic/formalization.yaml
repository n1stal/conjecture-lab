version: "v0.4"
project:
  name: "The Maple quartic for three nondeterministic steps"
  description: >-
    A word over A={−1}, B={−1,+1}, C={−2,+1} counts once if some selection
    of its signed steps gives a walk whose partial sums are nonnegative and
    whose final sum is zero. The ordinary length-generating series of those
    words satisfies exactly the degree-four polynomial in de Panafieu and
    Wallner's Maple companion, whose correctness they leave open in
    Section 6.2. The proof gives an all-length formal-series identity; it
    does not infer it from an initial sequence of coefficients.
  authors: ["Jaime Nistal"]
  responsible_maintainers: ["Jaime Nistal"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.CO"]
  msc2020: ["05A15"]
