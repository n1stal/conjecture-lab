version: "v0.4"
project:
  name: "Inverse Z-polynomial log-concavity through rank four"
  description: >-
    For any matroid on a finite ambient type of rank at most four, the inverse
    Z-polynomial has positive coefficients through rank and is log-concave.
    The proof uses a rank-four deletion inequality on flat incidences.
  authors:
    - "Jaime Nistal"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jaime Nistal"
classification:
  arxiv: ["math.CO"]
  msc2020: ["05B35", "03B35"]
sources:
  - title: "Log-concavity of inverse Z-polynomials through rank four"
    type: "other"
    id: "https://github.com/RokaSwK/conjecture-lab/blob/2d4a42f91c4a0419edf49c1264d979cd65806189/problems/inverse-z-rank-four.md"
    relationship: "formalizes"
    note: "Formalizes our earlier written proof at its pinned commit. No claim of priority."
  - title: "The inverse Z-polynomial of a matroid"
    authors: ["Alice L. L. Gao", "Xuan Ruan", "Matthew H. Y. Xie"]
    id: "https://arxiv.org/abs/2507.01332v1"
    location: "Conjecture 1.5 and Theorem 1.6"
    relationship: "background"
    note: "Original general conjecture; the paper proves sparse paving."
    author_endorsement: "not-contacted"
  - title: "Inverse Kazhdan–Lusztig polynomials of matroids under deletion"
    authors: ["Tom Braden", "Luis Ferroni", "Jacob P. Matherne", "Nutan Nepal"]
    id: "https://arxiv.org/abs/2510.01086v2"
    location: "Theorem 2.2"
    relationship: "background"
    note: "Source characterization of the inverse Z-polynomial."
    author_endorsement: "not-contacted"
status:
