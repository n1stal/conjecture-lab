name: Official Palomar preflight (Erdos 617 pair star and double star)
on:
  push:
    branches: [palomar/preflight-erdos617-pair-star-double]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight018
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"PalomarPackages/Erdos617PairStarDouble","comparator_config_path":"PalomarPackages/Erdos617PairStarDouble/comparator.json","formalization_metadata_path":"PalomarPackages/Erdos617PairStarDouble/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
