name: Official Palomar preflight (seven coins)
on:
  push:
    branches: [palomar/preflight-coin-seven]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight008
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"Palomar/CoinSeven/comparator.json","formalization_metadata_path":"Palomar/CoinSeven/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
