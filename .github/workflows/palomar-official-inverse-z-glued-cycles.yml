name: Official Palomar preflight (inverse Z edge-glued cycles)
on:
  push:
    branches: [palomar/preflight-inverse-z-glued-cycles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight024
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"PalomarPackages/GluedCyclesInverseZ","comparator_config_path":"PalomarPackages/GluedCyclesInverseZ/comparator.json","formalization_metadata_path":"PalomarPackages/GluedCyclesInverseZ/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
