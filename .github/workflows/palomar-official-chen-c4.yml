name: Official Palomar preflight (Chen Conjecture 4)
on:
  push:
    branches: [palomar/preflight-chen-c4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight009
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"results/delta-complement-total-domination","comparator_config_path":"results/delta-complement-total-domination/comparator.json","formalization_metadata_path":"results/delta-complement-total-domination/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
