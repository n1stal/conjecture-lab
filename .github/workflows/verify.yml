name: Publication gate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Get pinned Mathlib artifacts for the imported modules
        run: ./scripts/cache-imports.sh
      - name: Check proofs with warnings treated as errors
        run: lake build --wfail
      - name: Check catalogue and theorem axioms
        run: python3 scripts/check_publication.py --write-catalogue
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Match the official Comparator template on this disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare statement and solution with independent kernels
        run: ./check-comparator.sh
