name: Official Palomar preflight (Turau revision)
on:
  push:
    branches: [palomar/preflight-turau-v2]
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: turauv2a0001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"Palomar/Turau/comparator.json","formalization_metadata_path":"Palomar/Turau/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
