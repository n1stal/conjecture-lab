name: Palomar filing queue
on:
  push:
    branches: [main, ops/persistent-palomar-queue]
    paths:
      - .github/workflows/palomar-queue.yml
      - docs/palomar-queue.json
      - scripts/palomar_queue.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/palomar-queue.yml
      - docs/palomar-queue.json
      - scripts/palomar_queue.py
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate ID from docs/palomar-queue.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.queue.outputs.commit }}
      request_id: ${{ steps.queue.outputs.request_id }}
      options: ${{ steps.queue.outputs.options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: queue
        env:
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: python3 scripts/palomar_queue.py
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ needs.validate.outputs.commit }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: ${{ needs.validate.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ needs.validate.outputs.options }}
