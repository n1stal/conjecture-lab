name: Official Palomar preflight (walks Maple quartic)
on:
  push:
    branches: [palomar/preflight-walk-maple-quartic-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: n1stal/conjecture-lab
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight015
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"PalomarPackages/WalkMapleQuartic","comparator_config_path":"PalomarPackages/WalkMapleQuartic/comparator.json","formalization_metadata_path":"PalomarPackages/WalkMapleQuartic/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
